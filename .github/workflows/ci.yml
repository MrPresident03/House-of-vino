name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Also run the macOS/iOS job
        type: boolean
        default: false

permissions:
  contents: write # the publish step commits a summary to the ci-results branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  jvm-android:
    name: JVM tests + Android build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --continue --stacktrace \
            :core:jvmTest :data:jvmTest :composeApp:jvmTest :androidApp:assembleDebug 2>&1 | tee ci.log
      - name: Keep the debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: house-of-vino-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-results.sh jvm-android "${{ job.status }}" ci.log

  ios:
    name: iOS tests + simulator build
    # macOS minutes are billed at a multiple of Linux minutes, so this job is opt-in:
    # put [ios] in the commit message, or run the workflow manually with "ios" ticked.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.ios) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[ios]'))
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native tests (iOS simulator)
        run: |
          set -o pipefail
          ./gradlew --continue --stacktrace :core:iosSimulatorArm64Test :data:iosSimulatorArm64Test 2>&1 | tee ci.log
      - name: Xcode project and simulator build
        run: |
          set -o pipefail
          brew install xcodegen
          cd iosApp
          xcodegen generate
          xcodebuild -project HouseOfVino.xcodeproj -scheme HouseOfVino -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a ../ci.log | grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ../ci.log
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-results.sh ios "${{ job.status }}" ci.log
